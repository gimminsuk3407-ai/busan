<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUSAN INSIGHT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f5f5f7;
color:#191f28;
padding:40px;
}
.header{
max-width:1200px;
margin:auto;
padding:60px 20px;
}
.badge{
display:inline-block;
background:#2563eb;
color:white;
padding:8px 14px;
border-radius:999px;
font-size:14px;
margin-bottom:20px;
}
h1{
font-size:64px;
font-weight:800;
letter-spacing:-2px;
}
.subtitle{
margin-top:16px;
font-size:22px;
color:#6b7280;
line-height:1.6;
}
.grid{
max-width:1200px;
margin:20px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:24px;
}
.card{
background:white;
border-radius:28px;
padding:32px;
text-decoration:none;
color:#191f28;
box-shadow:0 2px 12px rgba(0,0,0,.05);
transition:.25s;
min-height:220px;
display:flex;
flex-direction:column;
justify-content:space-between;
}
.card:hover{
transform:translateY(-6px);
box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.number{
font-size:14px;
font-weight:700;
color:#2563eb;
}
.card h2{
font-size:30px;
margin:10px 0;
}
.card p{
color:#6b7280;
line-height:1.6;
}
.arrow{
font-size:32px;
text-align:right;
color:#2563eb;
}
footer{
max-width:1200px;
margin:40px auto;
color:#8b95a1;
padding:20px;
}
@media(max-width:700px){
body{padding:20px}
h1{font-size:46px}
.subtitle{font-size:18px}
}
</style>
</head>
<body>

<div class="header">
<div class="badge">BUSAN DATA HUB</div>
<h1>BUSAN INSIGHT</h1>
<p class="subtitle">
부산의 날씨 · 이슈 · 부경대 뉴스 · 사회복지 통계를<br>
한 곳에서 확인하는 데이터 포털
</p>
</div>

<div class="grid">

<a class="card" href="https://www.weather.go.kr/" target="_blank">
<div>
<div class="number">01</div>
<h2>날씨</h2>
<p>부산 지역 기상정보 및 예보 확인</p>
</div>
<div class="arrow">→</div>
</a>

<a class="card" href="https://www.busan.go.kr/" target="_blank">
<div>
<div class="number">02</div>
<h2>부산 이슈</h2>
<p>부산시 주요 정책 및 최신 소식</p>
</div>
<div class="arrow">→</div>
</a>

<a class="card" href="https://www.pknu.ac.kr/" target="_blank">
<div>
<div class="number">03</div>
<h2>부경대 뉴스</h2>
<p>부경대학교 공지사항 및 뉴스</p>
</div>
<div class="arrow">→</div>
</a>

<a class="card" href="https://kosis.kr/" target="_blank">
<div>
<div class="number">04</div>
<h2>사회복지 통계</h2>
<p>국가통계포털 사회복지 데이터</p>
</div>
<div class="arrow">→</div>
</a>

</div>

<footer>
© BUSAN INSIGHT · GitHub Pages Ready
</footer>

</body>
</html>
